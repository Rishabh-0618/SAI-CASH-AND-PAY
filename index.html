<!DOCTYPE html>
<html lang="en-GB"><head><meta charset="utf-8">
<meta name="color-scheme" content="light"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sai Cash &amp; Pay – Worthing</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#fff;--card:#fff;--tx:#14201a;--mu:#68736c;--bd:#e8ede9;--ac:#15803d;--ac2:#f0f9f2;--acx:#fff;--wa:#b4531a;--r:12px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Manrope,system-ui,sans-serif}
a{color:inherit;text-decoration:none}button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.w{max-width:1160px;margin:0 auto;padding:0 20px}
header.top{backdrop-filter:blur(8px);position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--bd)}
.bar{display:flex;align-items:center;gap:16px;height:64px}
.logo{font-weight:800;font-size:19px;letter-spacing:-.02em;white-space:nowrap}.logo b{color:var(--ac)}
.sr{position:relative;flex:1;max-width:520px}.sr input{width:100%;height:42px;border:1px solid var(--bd);border-radius:99px;padding:0 18px;background:#f6f8f6}.sr input:focus{background:#fff;border-color:var(--ac)}
.sug{position:absolute;top:46px;left:0;right:0;background:var(--card);border:1px solid var(--bd);border-radius:var(--r);box-shadow:0 6px 20px #0001;overflow:hidden}.sug a{display:block;padding:10px 16px}.sug a:hover{background:var(--ac2)}
.nav{display:flex;gap:6px;margin-left:auto;align-items:center}
.btn{border:1px solid var(--bd);background:var(--card);border-radius:99px;padding:9px 16px;cursor:pointer;font-weight:600;transition:transform .1s}.btn:active{transform:scale(.97)}
.btn.p{background:var(--ac);color:var(--acx);border-color:var(--ac)}.btn.s{padding:6px 12px;font-size:13px}.btn[disabled]{opacity:.45;cursor:not-allowed}
.cats{display:flex;gap:8px;overflow-x:auto;padding:10px 0;scrollbar-width:none}.cats a{white-space:nowrap;padding:6px 14px;border-radius:99px;font-size:14px;color:var(--mu)}.cats a:hover,.cats a.on{background:var(--ac2);color:var(--ac)}
.hero{padding:64px 0 48px;display:grid;grid-template-columns:1.2fr 1fr;gap:32px;align-items:center}
h1{font-size:clamp(32px,5vw,54px);line-height:1.05;letter-spacing:-.03em;margin:0 0 14px;font-weight:800}h2{font-size:21px;letter-spacing:-.02em;margin:48px 0 16px}
.mu{color:var(--mu)}.hv{background:var(--ac2);border:1px solid var(--bd);border-radius:24px;aspect-ratio:4/3;display:grid;place-items:center;font-size:96px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:14px;position:relative;transition:box-shadow .15s}.card:hover{border-color:#bfe3cb}
.img{aspect-ratio:1;background:var(--ac2);border-radius:10px;display:grid;place-items:center;font-size:56px}
.pn{font-weight:600;margin:10px 0 2px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:44px}
.bd{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--ac2);color:var(--ac)}.bd.w{background:#fff4e5;color:#8a4b08}.bd.r{background:#fde2e2;color:#a31515}
.pr{font-weight:800;font-size:17px}.old{text-decoration:line-through;color:var(--mu);font-size:13px;margin-left:6px}
.hb{position:absolute;top:18px;right:18px;border:0;background:var(--card);border-radius:99px;width:32px;height:32px;cursor:pointer}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}.tile{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:16px;font-weight:600}.tile span{display:block;font-size:30px}
.qs{display:inline-flex;border:1px solid var(--bd);border-radius:99px;align-items:center}.qs button{border:0;background:none;width:34px;height:34px;cursor:pointer;font-size:18px}.qs input{width:44px;text-align:center;border:0;background:none}
.layout{display:grid;grid-template-columns:1fr;gap:16px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.chip{border:1px solid var(--bd);background:var(--card);padding:6px 14px;border-radius:99px;cursor:pointer;font-size:14px}.chip.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.pd{display:grid;grid-template-columns:1fr 1fr;gap:32px;margin-top:28px}.pd .img{font-size:140px}
.dr{position:fixed;inset:0 0 0 auto;width:min(420px,100%);background:var(--bg);z-index:40;transform:translateX(105%);transition:transform .25s;padding:20px;overflow:auto;border-left:1px solid var(--bd)}.dr.o{transform:none}
.sh{position:fixed;inset:0;background:#0006;z-index:30;display:none}.sh.o{display:block}
.li{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--bd);align-items:center}.li .img{width:54px;font-size:26px;flex:none}
.tl{display:flex;justify-content:space-between;padding:3px 0}.tl.t{font-weight:800;border-top:1px solid var(--bd);margin-top:8px;padding-top:10px;font-size:17px}
.f{display:grid;gap:12px}.f label{display:grid;gap:4px;font-weight:600;font-size:14px}.f input,.f select{height:42px;border:1px solid var(--bd);border-radius:10px;padding:0 12px;background:var(--card)}.er{color:#c0261f;font-size:13px;font-weight:500}
.co{display:grid;grid-template-columns:1.4fr 1fr;gap:28px;margin-top:24px}.box{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:20px}
.steps{display:flex;gap:8px;margin-bottom:16px}.steps span{flex:1;height:4px;border-radius:9px;background:var(--bd)}.steps .on{background:var(--ac)}
.note{background:#f6faf7;border:1px solid var(--bd);color:var(--tx);border-radius:10px;padding:10px 12px;font-size:13px;margin:10px 0}
footer{margin-top:72px;background:#f6faf7;border-top:1px solid var(--bd);padding:32px 0 40px;font-size:14px;color:var(--mu)}footer .g{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:20px}footer b{color:var(--tx);display:block;margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:99px;z-index:60;font-weight:600;animation:ti .2s}@keyframes ti{from{opacity:0;transform:translate(-50%,10px)}}
.ad{display:grid;grid-template-columns:210px 1fr;min-height:100vh}.sb{background:var(--card);border-right:1px solid var(--bd);padding:20px 12px;position:sticky;top:0;height:100vh}.sb a{display:block;padding:9px 12px;border-radius:10px;font-weight:600;color:var(--mu)}.sb a.on{background:var(--ac2);color:var(--ac)}.sb{background:#fafcfa}
.am{padding:24px;min-width:0}.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px}.kp .box b{display:block;font-size:24px;letter-spacing:-.02em}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-weight:600}
dialog{border:1px solid var(--bd);border-radius:var(--r);background:var(--card);color:var(--tx);width:min(460px,92vw);padding:22px}dialog::backdrop{background:#0006}
.mb{display:none}
@media(max-width:820px){.hero,.pd,.co,footer .g{grid-template-columns:1fr}.hv{display:none}.hero{padding:28px 0}.ad{grid-template-columns:1fr}.sb{position:static;height:auto;display:flex;overflow-x:auto;gap:4px;padding:8px}.sb .logo{display:none}.bar{flex-wrap:wrap;height:auto;padding:10px 0}.sr{order:3;flex-basis:100%;max-width:none}.nav .hd{display:none}.pd .img{font-size:100px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>
<div id="root"></div><div class="sh" id="sh" data-a="close"></div><aside class="dr" id="dr" aria-label="Basket"></aside><dialog id="dlg"></dialog>
<script>
const $=s=>document.querySelector(s),gbp=p=>new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP'}).format(p/100);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ld=(k,d)=>{try{const v=localStorage.getItem('scp:'+k);return v?JSON.parse(v):d}catch(e){return d}},sv=(k,v)=>{try{localStorage.setItem('scp:'+k,JSON.stringify(v))}catch(e){}};
const CATS=['Groceries','Fresh Food','Snacks','Drinks','Household','Personal Care','World Foods','Alcohol'],EM={Groceries:'🍚','Fresh Food':'🥖',Snacks:'🍫',Drinks:'🥤',Household:'🧴','Personal Care':'🧼','World Foods':'🌶️',Alcohol:'🍺'};
const SEED=[['Basmati Rice 5kg','Tilda','Groceries','Rice & Grains',899,0,120,'🍚'],['Spaghetti 500g','Barilla','Groceries','Pasta',129,99,300,'🍝'],['Red Lentils 2kg','Natco','Groceries','Pulses',349,0,80,'🫘'],['Sunflower Oil 5L','Flora','Groceries','Cooking Oils',1199,999,40,'🌻'],['Plain Flour 1.5kg','Allinson','Groceries','Flour',139,0,6,'🌾'],['Chopped Tomatoes 400g','Napolina','Groceries','Canned Foods',79,0,500,'🥫'],['White Sliced Loaf','Warburtons','Fresh Food','Bakery',149,0,60,'🍞'],['Free Range Eggs x12','Happy Egg','Fresh Food','Dairy & Eggs',329,0,0,'🥚'],['Whole Milk 4 pints','Cravendale','Fresh Food','Dairy & Eggs',169,0,90,'🥛'],['Bananas 1kg','Fairtrade','Fresh Food','Fruit & Veg',119,0,70,'🍌'],['Ready Salted Crisps x24','Walkers','Snacks','Crisps',549,449,200,'🥔'],['Milk Chocolate Bar 360g','Cadbury','Snacks','Confectionery',399,0,150,'🍫'],['Digestive Biscuits 400g','McVitie\'s','Snacks','Biscuits',119,0,9,'🍪'],['Cola 24 x 330ml','Coca-Cola','Drinks','Soft Drinks',999,0,100,'🥤'],['Still Water 12 x 1.5L','Highland Spring','Drinks','Water',429,0,60,'💧'],['English Breakfast Tea 240 bags','Yorkshire Tea','Drinks','Tea & Coffee',899,0,75,'🍵'],['Instant Coffee 200g','Nescafé','Drinks','Tea & Coffee',849,699,45,'☕'],['Washing Up Liquid 1L','Fairy','Household','Cleaning',229,0,110,'🧽'],['Laundry Pods x40','Ariel','Household','Laundry',1299,1099,35,'🧺'],['Kitchen Roll x6','Plenty','Household','Paper',549,0,5,'🧻'],['Shower Gel 500ml','Dove','Personal Care','Body',249,0,85,'🧴'],['Toothpaste 100ml','Colgate','Personal Care','Oral Care',189,0,140,'🪥'],['Garam Masala 100g','Rajah','World Foods','Spices',179,0,65,'🌶️'],['Ghee 500g','Anchor','World Foods','Cooking Oils',699,0,30,'🧈'],['Lager 24 x 440ml','Stella Artois','Alcohol','Beer',2299,1999,25,'🍺','a'],['Red Wine 75cl','Casillero del Diablo','Alcohol','Wine',899,0,40,'🍷','a'],['Vodka 70cl','Smirnoff','Alcohol','Spirits',1599,0,0,'🥃','a']];
const mkP=()=>SEED.map((s,i)=>({id:i+1,sku:'SCP-'+(1000+i),name:s[0],brand:s[1],category:s[2],subcategory:s[3],price:s[4],salePrice:s[5],stock:s[6],low:10,emoji:s[7],isAlcohol:!!s[8],rating:+(4+((i*7)%10)/10).toFixed(1),desc:s[0]+' by '+s[1]+'. Demo product for illustration.',updated:Date.now()-i*36e5}));
const NAMES=['Priya Shah','Tom Hartley','Amira Khan','Jack Moore','Elena Rossi','Dev Patel'];
const mkO=P=>NAMES.map((n,i)=>{const it=[{id:1+i,q:2},{id:11+i,q:1}];return{id:'SCP-'+(10470+i),customer:n,own:false,items:it,subtotal:0,delivery:399,discount:0,total:0,status:['Delivered','Delivered','Out for Delivery','Processing','Confirmed','Pending'][i],pay:'Paid',addr:(10+i)+' Rowlands Road, Worthing, West Sussex, BN11 '+(1+i)+'AB',at:Date.now()-i*864e5,method:'Standard Delivery'}}).map(o=>{o.subtotal=o.items.reduce((s,x)=>s+eff(P.find(p=>p.id===x.id))*x.q,0);o.total=o.subtotal+o.delivery;return o});
const eff=p=>p.salePrice&&p.salePrice<p.price?p.salePrice:p.price;
const S={products:ld('p',null)||mkP(),cart:ld('c',{}),wish:ld('w',[]),recent:ld('r',[]),disc:ld('d',[{code:'SAVE10',type:'pct',val:10,min:5000,exp:'2030-12-31',on:true},{code:'FIVER',type:'fix',val:500,min:2500,exp:'2030-12-31',on:true},{code:'OLD20',type:'pct',val:20,min:0,exp:'2024-01-01',on:true}]),applied:null,admin:false,sh:{sort:'rel',stock:false,offer:false},co:{step:1,method:'std'},q:''};
S.orders=ld('o',null)||mkO(S.products);
const save=()=>{sv('p',S.products);sv('c',S.cart);sv('w',S.wish);sv('r',S.recent);sv('d',S.disc);sv('o',S.orders)};
const prod=id=>S.products.find(p=>p.id==id),status=p=>p.stock<=0?'Out of stock':p.stock<=p.low?'Low stock':'In stock';
function toast(m){const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2200)}
const FREE=5000;
function totals(){let sub=0;for(const id in S.cart){const p=prod(id);if(p)sub+=eff(p)*S.cart[id]}
let d=0,err='';const c=S.applied&&S.disc.find(x=>x.code===S.applied);if(c){if(sub<c.min)err='Spend '+gbp(c.min)+' or more to use '+c.code;else d=Math.min(sub,c.type==='pct'?Math.round(sub*c.val/100):c.val)}
const del=!sub||S.co.method==='col'?0:sub>=FREE?0:399;return{sub,d,del,total:sub-d+del,err}}
function clean(){for(const id in S.cart){const p=prod(id);if(!p||p.stock<=0)delete S.cart[id];else if(S.cart[id]>p.stock)S.cart[id]=p.stock}}
const card=p=>{const st=status(p),sale=p.salePrice&&p.salePrice<p.price;return`<article class="card"><a href="#/product/${p.id}" aria-label="${esc(p.name)}"><div class="img" role="img" aria-label="${esc(p.name)}">${p.emoji}</div><div class="pn">${esc(p.name)}</div></a><button class="hb" data-a="wish" data-id="${p.id}" aria-label="Save to wishlist" aria-pressed="${S.wish.includes(p.id)}">${S.wish.includes(p.id)?'♥':'♡'}</button><div class="mu" style="font-size:13px">${esc(p.brand)}</div><div style="margin:4px 0">${sale?'<span class="bd w">Offer</span> ':''}${p.isAlcohol?'<span class="bd r">18+</span> ':''}${st==='Low stock'?'<span class="bd w">Only '+p.stock+' left</span>':''}</div><div class="row"><div><span class="pr">${gbp(eff(p))}</span>${sale?`<span class="old">${gbp(p.price)}</span>`:''}</div><button class="btn p s" data-a="add" data-id="${p.id}" ${p.stock<=0?'disabled':''}>${p.stock<=0?'Sold out':'Add'}</button></div></article>`};
function head(){const n=Object.values(S.cart).reduce((a,b)=>a+b,0);return`<header class="top"><div class="w"><div class="bar"><a class="logo" href="#/">SAI <b>CASH &amp; PAY</b></a><div class="sr"><input id="q" type="search" placeholder="Search products, brands…" aria-label="Search" value="${esc(S.q)}" autocomplete="off"><div class="sug" id="sug" hidden></div></div><nav class="nav"><span class="hd mu" style="font-size:13px;margin-right:6px">📍 Worthing</span><a class="btn hd" href="#/wishlist">Wishlist</a><a class="btn hd" href="#/account">Account</a><button class="btn p" data-a="cart" aria-label="Open basket, ${n} items">Basket (${n})</button></nav></div><div class="cats"><a href="#/shop">All</a>${CATS.map(c=>`<a href="#/shop?cat=${encodeURIComponent(c)}">${c}</a>`).join('')}<a href="#/shop?offer=1">Offers</a></div></div></header>`}
const foot=()=>`<footer><div class="w"><div class="g"><div><b>Sai Cash &amp; Pay</b>Worthing, West Sussex, UK<p>Demo website — products, prices, stock, orders and customer information are illustrative only.</p><p>Alcohol sales and delivery are subject to applicable UK licensing, age-verification and delivery requirements.</p></div><div><b>Shop</b><a href="#/shop">All products</a><br><a href="#/shop?offer=1">Offers</a><br><a href="#/checkout">Collection</a></div><div><b>Help</b>Delivery: £3.99, free over ${gbp(FREE)}<br>Collection: free<br>Returns</div><div><b>Company</b><a href="#/account">My account</a><br><a href="#/admin">Admin (demo)</a></div></div></div></footer>`;
function home(){const f=S.products.filter(p=>p.stock>0);return`<div class="w"><section class="hero"><div><h1>Everything you need. In one place.</h1><p class="mu" style="font-size:17px;max-width:46ch">Groceries, household and drinks at warehouse prices, from our store in Worthing. Delivered to your door or ready to collect.</p><p><a class="btn p" href="#/shop">Shop now</a> <a class="btn" href="#/shop?cat=Groceries">Browse categories</a></p></div><div class="hv" aria-hidden="true">🛒</div></section>
<h2>Popular categories</h2><div class="tiles">${CATS.map(c=>`<a class="tile" href="#/shop?cat=${encodeURIComponent(c)}"><span>${EM[c]}</span>${c}</a>`).join('')}</div>
<h2>Special offers</h2><div class="grid">${f.filter(p=>p.salePrice).slice(0,4).map(card).join('')}</div>
<h2>Best sellers</h2><div class="grid">${f.sort((a,b)=>b.rating-a.rating).slice(0,4).map(card).join('')}</div>
${S.recent.length?`<h2>Recently viewed</h2><div class="grid">${S.recent.map(prod).filter(Boolean).slice(0,4).map(card).join('')}</div>`:''}
<h2>Delivery &amp; collection</h2><div class="tiles"><div class="tile"><span>🚚</span>Delivery £3.99, free over ${gbp(FREE)}</div><div class="tile"><span>🏬</span>Free store collection</div><div class="tile"><span>📍</span>Worthing, West Sussex</div></div></div>`}
function shop(P){let l=S.products.filter(p=>p.isActive!==false);const cat=P.get('cat'),q=(P.get('q')||'').toLowerCase();S.q=P.get('q')||'';
if(cat)l=l.filter(p=>p.category===cat);if(q)l=l.filter(p=>(p.name+p.brand+p.category+p.subcategory).toLowerCase().includes(q));if(P.get('offer')||S.sh.offer)l=l.filter(p=>p.salePrice);if(S.sh.stock)l=l.filter(p=>p.stock>0);
const so=S.sh.sort;l.sort((a,b)=>so==='lo'?eff(a)-eff(b):so==='hi'?eff(b)-eff(a):so==='new'?b.id-a.id:so==='pop'?b.rating-a.rating:0);
return`<div class="w"><h2 style="margin-top:28px">${esc(cat||(q?'Results for “'+P.get('q')+'”':'All products'))} <span class="mu" style="font-size:15px;font-weight:500">${l.length} items</span></h2><div class="chips"><button class="chip ${S.sh.stock?'on':''}" data-a="f" data-k="stock" aria-pressed="${S.sh.stock}">In stock</button><button class="chip ${S.sh.offer?'on':''}" data-a="f" data-k="offer" aria-pressed="${S.sh.offer}">Offers</button><select class="chip" data-c="sort" aria-label="Sort by"><option value="rel">Relevance</option><option value="lo" ${so==='lo'?'selected':''}>Price: low to high</option><option value="hi" ${so==='hi'?'selected':''}>Price: high to low</option><option value="new" ${so==='new'?'selected':''}>Newest</option><option value="pop" ${so==='pop'?'selected':''}>Popular</option></select>${q||cat?'<a class="chip" href="#/shop">Clear</a>':''}</div>${l.length?`<div class="grid">${l.map(card).join('')}</div>`:`<div class="box" style="text-align:center;padding:48px"><h3>No products found</h3><p class="mu">Try a different spelling, or clear your filters.</p><a class="btn p" href="#/shop" data-a="clr">Clear search</a></div>`}</div>`}
function pdp(id){const p=prod(id);if(!p||p.isActive===false)return`<div class="w box" style="margin-top:28px"><h2>Product not found</h2><p class="mu">This product may have been removed.</p><a class="btn p" href="#/shop">Back to shop</a></div>`;S.recent=[p.id,...S.recent.filter(x=>x!==p.id)].slice(0,8);save();const st=status(p),rel=S.products.filter(x=>x.category===p.category&&x.id!==p.id&&x.stock>0).slice(0,4);
return`<div class="w"><div class="pd"><div class="img" role="img" aria-label="${esc(p.name)}">${p.emoji}</div><div><a class="mu" href="#/shop?cat=${encodeURIComponent(p.category)}">${p.category} › ${p.subcategory}</a><h1 style="font-size:32px;margin-top:8px;overflow-wrap:anywhere">${esc(p.name)}</h1><p class="mu">${esc(p.brand)} · ★ ${p.rating} · SKU ${p.sku}</p><p><span class="pr" style="font-size:28px">${gbp(eff(p))}</span>${eff(p)<p.price?`<span class="old">${gbp(p.price)}</span>`:''}</p><p><span class="bd ${st==='In stock'?'':'w'}">${st}${st==='Low stock'?' – '+p.stock+' left':''}</span> ${p.isAlcohol?'<span class="bd r">Age restricted 18+</span>':''}</p><p>${esc(p.desc)}</p>${p.isAlcohol?'<div class="note">You must be 18 or over to buy alcohol. Demo only: no real age verification or alcohol delivery takes place. Please drink responsibly.</div>':''}

if(k==='newdisc'){const code=v.code.trim().toUpperCase();if(S.disc.some(d=>d.code===code))return toast('That code already exists');S.disc.push({code,type:v.type,val:v.type==='pct'?Math.min(100,+v.val):Math.round(v.val*100),min:Math.round(v.min*100),exp:v.exp,on:true});save();render();toast('Discount created')}
if(k==='prod'){const id=+f.dataset.id,o={name:v.name.trim(),brand:v.brand,category:v.category,price:Math.round(v.price*100),salePrice:Math.round((v.sale||0)*100),stock:Math.max(0,parseInt(v.stock)||0),low:parseInt(v.low)||0,updated:Date.now()};if(id)Object.assign(prod(id),o);else{const n=Math.max(0,...S.products.map(x=>x.id))+1;S.products.push({id:n,sku:'SCP-'+(1000+n),subcategory:'General',emoji:EM[o.category],isAlcohol:o.category==='Alcohol',rating:4.5,desc:o.name+'. Demo product.',...o})}save();$('#dlg').close();render();toast(id?'Inventory updated':'Product added successfully')}});
addEventListener('hashchange',render);S.co.step=1;render();
</script></body></html>
